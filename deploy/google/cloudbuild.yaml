  # Paso 1: Instalar dependencias
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --upgrade pip
        pip install -r requirements.txt

  # Paso 2: Ejecutar tests
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        

  # Paso 3: Construir la imagen Docker
  - id: 'Build docker image'
    name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_DOCKER_REPOSITORY}/${_COMPONENT_NAME}:$BUILD_ID'
      - '.'

  # Paso 4: Push de la imagen a Container Registry
  - id: 'Push docker image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_DOCKER_REPOSITORY}/${_COMPONENT_NAME}:$BUILD_ID'

  # Paso 5: Desplegar a Cloud Run Jobs
  - id: 'Deploy to Cloud Run'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_COMPONENT_NAME}-${_ENV}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_DOCKER_REPOSITORY}/${_COMPONENT_NAME}:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--service-account'
      - '${_RUN_SERVICE_ACCOUNT_EMAIL}'
      - '--set-env-vars=ENV=${_ENV}'
      - '--set-env-vars=PROJECT_ID=${_PROJECT_ID}'
      - '--set-env-vars=FIRESTORE_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=FIRESTORE_COLLECTION=${_FIRESTORE_COLLECTION}'
      - '--set-env-vars=FIRESTORE_DATABASE=${_FIRESTORE_DATABASE}'
      - '--set-env-vars=FIRESTORE_AGENT_ID=${_FIRESTORE_AGENT_ID}'
      - '--set-env-vars=SFTP_HOST=${_SFTP_HOST}'
      - '--set-env-vars=SFTP_PORT=${_SFTP_PORT}'
      - '--set-secrets=SFTP_USERNAME=sftp-username:latest,SFTP_PASSWORD=sftp-password:latest'
      - '--set-env-vars=EXPORT_SFTP_TXT_PATH=${_EXPORT_SFTP_TXT_PATH}'


# Configuraciones adicionales
options:
  logging: CLOUD_LOGGING_ONLY

# Timeout del build
timeout: '1200s'
